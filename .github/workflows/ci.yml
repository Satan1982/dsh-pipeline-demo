name: ci

on:
  push:
    branches: [main]
  pull_request:

# P1-8：默认令牌权限收到只读；仓库默认是 read/write，工作流不应隐式拿写权。
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Gate
        run: bash scripts/verify.sh
      - name: Witness keyring
        # P3：GitHub Actions 验签的最小闭环——CI 加载 governance/keys（公钥 + 撤销账本）并验链。
        # 链文件是本地 .logs 审计日志、不进仓库，因此 CI 里通常是空链（PASS）；一旦链随提交
        # 进入仓库（或后续改成 governance/witness.jsonl），这一步会自动按 ed25519 验签。
        run: |
          test -d governance/keys
          node ci/trust/verify.mjs --keys governance/keys
      - name: Test counts must not shrink
        if: github.event_name == 'pull_request'
        run: |
          BASE="${{ github.base_ref }}"
          OLD=$(git show "origin/$BASE:scripts/test-baseline.txt" 2>/dev/null | cut -d' ' -f1 || true)
          NEW=$(cut -d' ' -f1 scripts/test-baseline.txt)
          echo "tests baseline: ${OLD:-<none>} -> $NEW"
          if [ -n "$OLD" ] && [ "$NEW" -lt "$OLD" ]; then
            echo "::error::测试基线被降低（$OLD -> $NEW），禁止同时删测试和降基线"
            exit 1
          fi
          OLDA=$(git show "origin/$BASE:scripts/test-baseline.txt" 2>/dev/null | cut -d' ' -f2 || true)
          NEWA=$(cut -d' ' -f2 scripts/test-baseline.txt)
          echo "asserts baseline: ${OLDA:-<none>} -> $NEWA"
          if [ -n "$OLDA" ] && [ "$NEWA" -lt "$OLDA" ]; then
            echo "::error::断言基线被降低（$OLDA -> $NEWA），禁止同时删断言和降基线"
            exit 1
          fi
      - name: Assertion content must not be rewritten
        if: github.event_name == 'pull_request'
        run: |
          BASE="${{ github.base_ref }}"
          if git show "origin/$BASE:scripts/assert-baseline.txt" > /tmp/assert-base.txt 2>/dev/null; then
            node scripts/assert-guard.mjs --baseline /tmp/assert-base.txt --allow-additions
          else
            echo "base branch has no assert-baseline.txt yet, skipping"
          fi
