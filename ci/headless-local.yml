# 本地模型路由：只走 127.0.0.1:13305 的 Lemonade，不需要任何真实凭据。
# 用途：无人值守执行器默认挂这份 patch，agent 手里没有真 key（docs/76 §13 S1）。
# 换模型改这里；本文件不含任何密钥，可进版本库。
- id: llm-pi-ai
  name: "@deepseek-ai/dsh-llm-pi-ai"
  config:
    providers:
      lemonade:
        displayName: Lemonade local
        apiKeyEnv: LEMONADE_API_KEY
        api: openai-completions
        baseURL: http://127.0.0.1:13305/api/v1
        defaultContextWindow: 65536
        defaultMaxTokens: 8192
        models:
          - id: Qwen3.5-9B-GGUF
            name: Qwen3.5-9B local
            contextWindow: 65536
            maxTokens: 8192
            input:
              - text
- id: agent-default-model
  config:
    provider: lemonade
    model: Qwen3.5-9B-GGUF
